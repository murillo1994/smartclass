<!DOCTYPE html>
<html lang="pt-BR" class="h-full bg-slate-50/60 selection:bg-indigo-500 selection:text-white">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartClass • Acesso ao Sistema</title>
  
  <!-- Script Anti-FOUC de Inicialização do Tema -->
  <script>
    (function() {
      const savedTheme = localStorage.getItem('smartclass_theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    })();
  </script>

  <!-- Tailwind CSS via CDN com darkMode: 'class' -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
          },
          boxShadow: {
            'subtle': '0 1px 3px 0 rgba(0, 0, 0, 0.04), 0 1px 2px -1px rgba(0, 0, 0, 0.04)',
            'card': '0 4px 20px -4px rgba(0, 0, 0, 0.05), 0 2px 6px -2px rgba(0, 0, 0, 0.02)',
            'card-hover': '0 12px 28px -6px rgba(0, 0, 0, 0.08), 0 4px 12px -2px rgba(0, 0, 0, 0.03)',
            'auth': '0 20px 40px -15px rgba(0, 0, 0, 0.08), 0 0 0 1px rgba(0, 0, 0, 0.04)'
          }
        }
      }
    }
  </script>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    .shake-animation {
      animation: shake 0.4s ease-in-out;
    }
  </style>
</head>
<body class="min-h-full flex flex-col justify-center py-12 sm:px-6 lg:px-8 bg-slate-50/70 dark:bg-slate-950 text-slate-800 dark:text-slate-100 transition-colors duration-200">

  <!-- Botão Flutuante de Alternância de Tema -->
  <div class="fixed top-4 right-4 z-20">
    <button id="btnThemeToggle" title="Alternar entre tema claro e escuro" class="inline-flex items-center justify-center p-2 rounded-xl bg-white dark:bg-slate-900 hover:bg-slate-50 dark:hover:bg-slate-800 text-slate-600 dark:text-amber-400 border border-slate-200/80 dark:border-slate-800 shadow-subtle active:scale-95 transition-all group">
      <!-- Ícone Sol -->
      <svg id="iconSun" class="w-4 h-4 hidden dark:block text-amber-400 group-hover:rotate-45 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
      </svg>
      <!-- Ícone Lua -->
      <svg id="iconMoon" class="w-4 h-4 block dark:hidden text-slate-600 group-hover:-rotate-12 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
      </svg>
    </button>
  </div>

  <div class="sm:mx-auto sm:w-full sm:max-w-md px-4">
    
    <!-- Branding e Logotipo -->
    <div class="text-center">
      <div class="inline-flex w-12 h-12 rounded-2xl bg-gradient-to-tr from-indigo-600 via-indigo-500 to-sky-400 items-center justify-center text-white shadow-card mb-3 ring-1 ring-indigo-500/20">
        <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
        </svg>
      </div>
      <h1 class="text-2xl font-extrabold tracking-tight text-slate-900 dark:text-white">SmartClass</h1>
      <p class="text-xs text-slate-500 dark:text-slate-400 mt-1 font-medium">Plataforma de Monitoramento Térmico Escolar</p>
    </div>

    <!-- Card de Autenticação -->
    <div id="authCard" class="mt-8 bg-white dark:bg-slate-900 py-8 px-6 shadow-auth sm:rounded-3xl sm:px-10 border border-slate-200/80 dark:border-slate-800 relative transition-all duration-200">
      
      <div class="mb-6">
        <h2 class="text-base font-bold text-slate-900 dark:text-white tracking-tight">Acesso ao Painel de Controle</h2>
        <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">Entre com suas credenciais de operador</p>
      </div>

      <!-- Alerta de Erro -->
      <div id="errorAlert" class="hidden mb-4 p-3.5 rounded-xl bg-rose-500/10 dark:bg-rose-950/40 border border-rose-500/20 text-rose-700 dark:text-rose-300 text-xs flex items-start gap-2.5">
        <svg class="w-4 h-4 text-rose-500 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        <span id="errorMessage">Usuário ou senha incorretos.</span>
      </div>

      <form id="loginForm" class="space-y-4">
        
        <!-- Campo: Usuário -->
        <div>
          <label for="username" class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1.5">
            Usuário
          </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
              </svg>
            </div>
            <input id="username" name="username" type="text" autocomplete="username" required
              placeholder="ex: univesp"
              class="block w-full pl-10 pr-3.5 py-2.5 bg-slate-50 dark:bg-slate-800/80 border border-slate-200/80 dark:border-slate-700 rounded-xl text-xs text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all shadow-subtle">
          </div>
        </div>

        <!-- Campo: Senha -->
        <div>
          <label for="password" class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1.5">
            Senha
          </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
              </svg>
            </div>
            <input id="password" name="password" type="password" autocomplete="current-password" required
              placeholder="••••••••"
              class="block w-full pl-10 pr-10 py-2.5 bg-slate-50 dark:bg-slate-800/80 border border-slate-200/80 dark:border-slate-700 rounded-xl text-xs text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all shadow-subtle">
            
            <!-- Toggle Mostrar/Ocultar Senha -->
            <button type="button" id="btnTogglePassword" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-colors">
              <svg id="iconEyeOpen" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
              </svg>
              <svg id="iconEyeClosed" class="w-4 h-4 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Opção Lembrar Sessão -->
        <div class="flex items-center justify-between text-xs pt-1">
          <label class="flex items-center gap-2 text-slate-600 dark:text-slate-400 cursor-pointer">
            <input id="rememberMe" type="checkbox" checked class="w-3.5 h-3.5 text-indigo-600 rounded border-slate-300 dark:border-slate-700 focus:ring-indigo-500">
            <span>Manter conectado</span>
          </label>
        </div>

        <!-- Botão Entrar -->
        <div class="pt-2">
          <button type="submit" id="btnSubmit" class="w-full flex items-center justify-center gap-2 py-2.5 px-4 rounded-xl bg-slate-900 dark:bg-indigo-600 hover:bg-slate-800 dark:hover:bg-indigo-700 text-white text-xs font-semibold shadow-sm hover:shadow active:scale-98 transition-all">
            <span id="btnText">Acessar Painel</span>
            <svg id="btnSpinner" class="w-4 h-4 text-white animate-spin hidden" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
          </button>
        </div>

      </form>

    </div>

    <!-- Informações Acadêmicas -->
    <div class="mt-6 text-center text-[11px] text-slate-400 dark:text-slate-500 space-y-1">
      <p>UNIVESP • Universidade Virtual do Estado de São Paulo</p>
      <p>Projeto Integrador em Computação IV • Engenharia de Computação</p>
    </div>

  </div>

  <!-- Script de Controle do Login -->
  <script type="module">
    import { loginUser, isAuthenticated } from './js/auth.js';

    // Se já autenticado, redireciona diretamente ao dashboard
    if (isAuthenticated()) {
      window.location.href = 'dashboard.html';
    }

    const form = document.getElementById('loginForm');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const rememberMeInput = document.getElementById('rememberMe');
    const btnSubmit = document.getElementById('btnSubmit');
    const btnText = document.getElementById('btnText');
    const btnSpinner = document.getElementById('btnSpinner');
    const errorAlert = document.getElementById('errorAlert');
    const errorMessage = document.getElementById('errorMessage');
    const authCard = document.getElementById('authCard');
    const btnTogglePassword = document.getElementById('btnTogglePassword');
    const iconEyeOpen = document.getElementById('iconEyeOpen');
    const iconEyeClosed = document.getElementById('iconEyeClosed');
    const btnThemeToggle = document.getElementById('btnThemeToggle');

    // Alternar visibilidade de senha
    btnTogglePassword?.addEventListener('click', () => {
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        iconEyeOpen.classList.add('hidden');
        iconEyeClosed.classList.remove('hidden');
      } else {
        passwordInput.type = 'password';
        iconEyeOpen.classList.remove('hidden');
        iconEyeClosed.classList.add('hidden');
      }
    });

    // Alternador de tema no login
    btnThemeToggle?.addEventListener('click', () => {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('smartclass_theme', isDark ? 'dark' : 'light');
    });

    // Submissão do formulário
    form?.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      errorAlert.classList.add('hidden');
      btnSubmit.disabled = true;
      btnText.textContent = 'Autenticando...';
      btnSpinner.classList.remove('hidden');

      const username = usernameInput.value.trim();
      const password = passwordInput.value.trim();
      const remember = rememberMeInput.checked;

      const result = await loginUser(username, password, remember);

      if (result.success) {
        btnText.textContent = 'Sucesso! Redirecionando...';
        btnSubmit.classList.remove('bg-slate-900', 'dark:bg-indigo-600');
        btnSubmit.classList.add('bg-emerald-600');
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 500);
      } else {
        btnSubmit.disabled = false;
        btnText.textContent = 'Acessar Painel';
        btnSpinner.classList.add('hidden');

        errorMessage.textContent = result.message || 'Usuário ou senha incorretos.';
        errorAlert.classList.remove('hidden');

        // Efeito de shake no card
        authCard.classList.remove('shake-animation');
        void authCard.offsetWidth; // trigger reflow
        authCard.classList.add('shake-animation');
      }
    });
  </script>
</body>
</html>
