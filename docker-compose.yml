version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: smartclass_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smartclass_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartclass_secret}
      POSTGRES_DB: ${POSTGRES_DB:-smartclass_db}
    volumes:
      - smartclass_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smartclass_user} -d ${POSTGRES_DB:-smartclass_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - smartclass_net
    restart: always

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: smartclass_backend
    ports:
      - "5070:5000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://smartclass_user:smartclass_secret@db:5432/smartclass_db}
      - POSTGRES_DB=${POSTGRES_DB:-smartclass_db}
      - POSTGRES_USER=${POSTGRES_USER:-smartclass_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-smartclass_secret}
      - POSTGRES_HOST=${POSTGRES_HOST:-db}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - FLASK_ENV=${FLASK_ENV:-production}
      - PORT=5000
      - SMARTCLASS_USER=${SMARTCLASS_USER:-univesp}
      - SMARTCLASS_PASS=${SMARTCLASS_PASS:-p4univesp}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - smartclass_net
    restart: always

volumes:
  smartclass_pgdata:

networks:
  smartclass_net:
    driver: bridge
